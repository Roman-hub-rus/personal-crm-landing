# Copy of the landing's server block, kept here for history.
# On the server it lives in /etc/nginx/sites-available/myfirstcrm.conf, a file shared with the app
# (it also holds the port 80 redirect, the default servers and app.myfirstcrm.site).
# That file already has "server_tokens off;" at its top: nginx does not show its version.

# Landing: static files in /var/www/myfirstcrm.site (the deploy uploads them there)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myfirstcrm.site;
    include snippets/myfirstcrm-tls.conf;
    include snippets/myfirstcrm-landing-headers.conf;

    root /var/www/myfirstcrm.site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
