# Security headers for the landing (myfirstcrm.site).
# Server path: /etc/nginx/snippets/myfirstcrm-landing-headers.conf,
# included from the landing server block (see landing-server.conf in this folder).
#
# "always" sends the headers on every response, 404 included.
# nginx drops server-level add_header in any block that has its own add_header,
# so do not add add_header inside the landing's locations, or extend this file instead.

# Browsers go to https only, for a year. Only this domain: the app subdomains decide for themselves.
add_header Strict-Transport-Security "max-age=31536000" always;

# Only our own files. Inline scripts and styles are allowed (no nonce), the page is not changed for CSP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# No embedding in frames on other sites (old browsers; new ones use frame-ancestors above)
add_header X-Frame-Options "DENY" always;

# Other sites see only our domain, not the full address
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The browser trusts Content-Type and does not guess the file type
add_header X-Content-Type-Options "nosniff" always;

# The page needs no camera, microphone, location, payments and other device APIs
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
